name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a public download (GitHub Release) with this APK. Needs the signing secrets."
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick and unpack the NEWEST project zip (and refuse an old one)
        run: |
          # The zip committed MOST RECENTLY wins (so uploading DjApp-480p.zip is enough; an older zip in the repo is ignored)
          ZIP=$(for f in DjApp*.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            echo "ZIP_NAME=$(basename "$ZIP" .zip)" >> "$GITHUB_ENV"
            rm -rf DjApp
            unzip -q -o "$ZIP"
          elif [ -f DjApp/settings.gradle.kts ]; then
            echo "No zip in the repo; using the committed DjApp folder"
            echo "ZIP_NAME=DjApp-folder" >> "$GITHUB_ENV"
          else
            echo "::error::No DjApp*.zip found in the repo root"; ls -la; exit 1
          fi
          # Things that only exist in the newest version (EQ, stems prep, sampler, video): stop if missing.
          for f in app/src/main/cpp/stretch.h app/src/main/java/com/example/djapp/Prepared.kt \
                   app/src/main/java/com/example/djapp/Sampler.kt app/src/main/java/com/example/djapp/VideoMixer.kt \
                   app/src/main/java/com/example/djapp/VideoProxy.kt; do
            test -f "DjApp/$f" || { echo "::error::DjApp/$f missing: OLD version in $ZIP"; exit 1; }
          done
          grep -q "setEq" DjApp/app/src/main/cpp/engine.cpp || { echo "::error::No EQ in $ZIP: OLD version"; exit 1; }
          echo "Building the newest version"
      - name: Cache AI model (SCNet-large, 45 MB, downloaded by Gradle at build time)
        uses: actions/cache@v4
        with:
          path: DjApp/app/src/main/assets/scnet-large.int8.onnx
          key: scnet-large-int8-onnx-v1
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Prepare release signing (only when you added the KEYSTORE secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maxido-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/maxido-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}0
          VERSION_NAME: 1.0.${{ github.run_number }}
        working-directory: DjApp
        run: gradle assembleRelease --stacktrace > build.log 2>&1 || (echo BUILD_FAILED >> build.log; exit 1)
      - name: Show errors
        if: failure()
        working-directory: DjApp
        run: |
          grep -E "^e: |error:|What went wrong|Could not|checksum|SCNet" -A3 build.log | head -30 > err.txt || true
          echo "----- last lines -----" >> err.txt
          tail -15 build.log >> err.txt
          cat err.txt
          MSG=$(head -c 3500 err.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::$MSG"
          sed 's/^/    /' err.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report what takes space inside the APK
        run: |
          APK=DjApp/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          echo "===== 25 BIGGEST FILES ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {print $1, $3, $8}' | sort -rn | head -25 | awk '{printf "%7.1f MB raw, %7.1f MB in APK  %s\n", $1/1048576, $2/1048576, $3}'
          echo "===== PER FOLDER (MB) ====="
          unzip -lv "$APK" | awk 'NR>3 && NF>=8 {split($8,a,"/"); d[a[1]"/"a[2]]+=$1} END {for (k in d) printf "%7.1f  %s\n", d[k]/1048576, k}' | sort -rn | head -12
      - name: Name the APK after the zip it was built from
        run: |
          APK_NAME="MAXXIDO-DJ"
          cp DjApp/app/build/outputs/apk/release/app-release.apk "DjApp/${APK_NAME}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          {
            echo "## Built from: \`${ZIP_NAME}.zip\`"
            echo "APK file: \`${APK_NAME}.apk\` (run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNED" = "release" ]; then
            echo "Signed with your permanent release key: customers can update over older versions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: signed with a throw-away debug key. Do NOT give this APK to customers (they could not update it later)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: DjApp/${{ env.APK_NAME }}.apk
      - name: Publish the public download (one release only: v1.0.0.0.1)
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0.0.1 >/dev/null 2>&1 || gh release create v1.0.0.0.1 --title "MAXXIDO DJ" --notes "MAXXIDO DJ for Android and Windows." --latest
          gh release upload v1.0.0.0.1 "DjApp/${APK_NAME}.apk" --clobber
      - name: Note about the signing key
        if: ${{ github.event.inputs.publish == 'true' && env.SIGNED != 'release' }}
        run: |
          echo "::warning::Published with the debug key. Add the KEYSTORE secrets (see RELEASE.md) so later versions can update over this one."
